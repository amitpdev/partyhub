<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <title>Party Hub</title>
    <script>
      if (!window.location.pathname.startsWith('/guest')) {
        try {
          const saved = localStorage.getItem('partyhub.theme.v1')
          const themes = [
            'midnight-violet',
            'signal-orange',
            'electric-blue',
            'terminal-green',
            'high-contrast',
          ]
          document.documentElement.dataset.theme = themes.includes(saved) ? saved : 'midnight-violet'
        } catch {
          document.documentElement.dataset.theme = 'midnight-violet'
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
